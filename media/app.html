<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0d0f11">
<title>Kiro Remote</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#0d0f11; --card:#16191d; --card2:#1c2025; --line:#24282e; --line2:#2f343b;
    --fg:#e8eaed; --fg2:#b6bec6; --dim:#8b949e; --faint:#6b7480;
    --blue:#4a9eff; --green:#3fb950; --amber:#d29922; --red:#f85149; --purple:#a371f7;
    --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{display:flex;flex-direction:column;height:100%}

  /* ---------- 顶栏 ---------- */
  header{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
  .hrow{display:flex;align-items:center;gap:10px;min-height:34px}
  /* Kiro 标记 + 叠在右下角的连接状态点 */
  .brand{position:relative;flex:0 0 auto;width:27px;height:27px}
  .brand svg{width:100%;height:100%;display:block}
  .brand .dot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;
    border:2px solid var(--bg)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto;
    transition:background .2s}
  .dot.running{background:var(--green);box-shadow:0 0 0 3px #3fb95022;animation:bp 1.5s infinite}
  .dot.waiting{background:var(--amber);box-shadow:0 0 0 3px #d2992222;animation:bp .9s infinite}
  /* 连着且空闲：绿色常亮。灰色只在页面刚打开、还没连上时出现 */
  .dot.on{background:var(--green)}
  .dot.off{background:var(--red);box-shadow:0 0 0 3px #f8514922}
  @keyframes bp{0%,100%{opacity:1}50%{opacity:.4}}
  .htitle{flex:1;min-width:0;font-size:16px;font-weight:600;letter-spacing:-.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hsub{font-size:11px;color:var(--dim);font-weight:400;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;
    justify-content:center;border:none;background:transparent;color:var(--fg2);
    border-radius:9px;font-size:17px;padding:0}
  .iconbtn:active{background:var(--card2)}
  .hide{display:none!important}

  /* ---------- 搜索 ---------- */
  .searchwrap{padding:8px 0 2px}
  .searchwrap input{width:100%;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;color:var(--fg);font:inherit;font-size:14px}
  .searchwrap input::placeholder{color:var(--faint)}

  main{flex:1;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
    padding:10px 12px calc(env(safe-area-inset-bottom) + 12px)}

  /* ---------- 筛选条 ---------- */
  .fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;
    color:var(--dim);margin:0 0 12px}
  .fbar .sp{margin-left:auto;display:flex;gap:6px}
  .chip{font:inherit;font-size:11px;padding:5px 10px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);color:var(--fg2)}
  .chip:active{background:var(--card2)}
  .chip.on{background:#4a9eff1f;border-color:#4a9eff66;color:var(--blue)}


  /* ---------- 会话卡片（含左滑） ---------- */
  .sw{position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:8px;
    background:#2b3239}
  .sw-act{position:absolute;inset:0 0 0 auto;width:76px;display:flex;align-items:center;
    justify-content:center;color:var(--fg2)}
  .sw-act svg{width:21px;height:21px;display:block}
  .card{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:11px 13px 10px;will-change:transform}
  .card.anim{transition:transform .22s cubic-bezier(.22,.61,.36,1)}
  .card:active{background:var(--card2)}
  .card .bar{position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:0 2px 2px 0;
    background:transparent}
  .card.s-running .bar{background:var(--green)}
  .card.s-waiting .bar{background:var(--amber)}
  .ttl{font-size:14.5px;font-weight:500;line-height:1.42;color:var(--fg);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{margin-top:6px;display:flex;align-items:center;gap:6px;font-size:11px;
    color:var(--faint);min-width:0}
  .meta .t{color:var(--dim)}
  .meta .sep{opacity:.4}
  .meta .model,.meta .ws{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta .ws{color:var(--dim)}
  .badge{margin-left:auto;flex:0 0 auto;font-size:10px;padding:2px 7px;border-radius:999px;
    border:1px solid transparent;font-weight:500}
  .badge.running{color:var(--green);background:#3fb95018;border-color:#3fb95040}
  .badge.waiting{color:var(--amber);background:#d2992218;border-color:#d2992240}

  /* ---------- 归档页 ---------- */
  .arch{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:8px}
  .arch-main{flex:1;min-width:0}
  .arch-back{flex:0 0 auto;font:inherit;font-size:12.5px;padding:7px 13px;border-radius:8px;
    background:var(--card2);border:1px solid var(--line2);color:var(--fg2)}
  .arch-back:active{background:#333a42}
  .arch-all{width:100%;margin-top:12px;padding:12px;border-radius:10px;font:inherit;
    font-size:13.5px;background:transparent;border:1px solid var(--line2);color:var(--dim)}

  /* ---------- 会话详情 ---------- */
  .u{display:flex;justify-content:flex-end;margin:0 0 12px}
  /* 用户气泡：要一眼能从整屏深色里分出来，所以给足饱和度和边框对比 */
  .u .b{max-width:88%;background:#1d4b80;border:1px solid #3d7ec4;
    border-radius:14px 14px 4px 14px;padding:10px 13px;font-size:14.5px;color:var(--fg);
    box-shadow:0 1px 3px #00000059;white-space:pre-wrap;word-break:break-word}
  /* 助手消息：左侧 Kiro 头像 + 全宽正文（长文本不套气泡，可读性更好） */
  .arow{display:flex;gap:9px;align-items:flex-start;margin:0 0 14px}
  .ava{flex:0 0 auto;width:22px;height:22px;margin-top:1px}
  .ava svg{width:100%;height:100%;display:block}
  .arow .a{margin:0;flex:1;min-width:0}
  /* 块级由 mdRender 生成，所以换行交给段落自己处理，不在容器上开 pre-wrap */
  .a{margin:0 0 14px;font-size:14.5px;line-height:1.62;color:var(--fg2);word-break:break-word}
  .a strong{color:var(--fg);font-weight:600}
  .a .pp{margin:0 0 10px;white-space:pre-wrap}
  .a .pp:last-child{margin-bottom:0}
  .a .mh{margin:15px 0 8px;color:var(--fg);font-weight:600;font-size:15px}
  .a .mh:first-child{margin-top:0}
  .a .ml{margin:0 0 10px;padding-left:19px}
  .a .ml li{margin:3px 0}
  .a blockquote{margin:0 0 10px;padding:1px 0 1px 10px;border-left:2px solid var(--line2);
    color:var(--dim);white-space:pre-wrap}
  .a .cb{margin:0 0 10px;padding:10px 11px;background:var(--card);border:1px solid var(--line);
    border-radius:8px;overflow-x:auto}
  .a .cb code{background:none;border:none;padding:0;font-size:12px;line-height:1.5;
    white-space:pre;color:var(--fg2)}
  /* 表格在手机上必然溢出，所以外层单独给一个横向滚动容器 */
  .a .tw{margin:0 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  /*
    width:max-content + 单元格 nowrap 是关键：表格只有在固有宽度超过容器时才会横向溢出。
    只给 th 设 nowrap 的话，浏览器宁可把长单元格压成一字一行也不触发滚动。
  */
  .a table{border-collapse:collapse;font-size:12.5px;width:max-content}
  .a th,.a td{border:1px solid var(--line);padding:7px 10px;text-align:left;
    vertical-align:top;white-space:nowrap}
  .a th{background:var(--card2);color:var(--fg);font-weight:600}
  /* 行内代码：正文与用户气泡里都可能出现 */
  .a code,.u .b code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:.88em;
    background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:1px 4px;
    color:var(--fg)}
  .u .b strong{color:#fff;font-weight:600}
  .u .b code{background:#00000038;border-color:#ffffff26}

  /* ---------- 待发送的附件 ---------- */
  .atts{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
  .att{display:flex;align-items:center;gap:6px;min-width:0;background:var(--card2);
    border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font-size:11.5px;
    color:var(--fg2)}
  .att img{width:26px;height:26px;object-fit:cover;border-radius:4px;flex:0 0 auto}
  .att .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw}
  .att .sz{color:var(--faint);flex:0 0 auto}
  .att .x{flex:0 0 auto;color:var(--faint);padding:0 2px;font-size:14px}
  /* 附件入口：单个 + 按钮 + 弹出菜单，和输入区其他控件同一套描边规范 */
  .attwrap{position:relative;flex:0 0 auto}
  .attbtn{width:42px;height:42px;border-radius:50%;padding:0;background:transparent;
    border:1px solid var(--line2);color:var(--dim);display:flex;align-items:center;
    justify-content:center}
  .attbtn svg{width:20px;height:20px;display:block}
  .attbtn:active{background:var(--card2);color:var(--fg2)}
  .attmenu{position:absolute;left:0;bottom:50px;z-index:5;min-width:142px;padding:5px;
    background:var(--card2);border:1px solid var(--line2);border-radius:11px;
    box-shadow:0 8px 24px #00000066}
  .attmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;
    background:none;border:none;border-radius:8px;color:var(--fg2);font:inherit;
    font-size:13.5px;text-align:left}
  .attmenu button:active{background:#333a42}
  .attmenu svg{width:17px;height:17px;flex:0 0 auto;color:var(--dim);display:block}
  .tool{margin:0 0 8px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;overflow:hidden}
  .tool .hd{display:flex;align-items:center;gap:7px;padding:8px 11px;font-size:12.5px}
  .tool .caret{color:var(--faint);font-size:10px;transition:transform .18s;flex:0 0 auto}
  .tool.open .caret{transform:rotate(90deg)}
  .tool .nm{color:var(--fg2);font-weight:500;font-family:ui-monospace,SFMono-Regular,monospace;
    font-size:12px}
  .tool .ex{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    min-width:0;flex:1}
  .tool .st{flex:0 0 auto;font-size:10px;color:var(--faint)}
  .tool .st.failed,.tool .st.denied{color:var(--red)}
  .tool .st.approved{color:var(--green)}
  /* 与默认灰同色，但显式写出来：「已取消」是中性结局，不该跟「已拒绝」一样刺眼 */
  .tool .st.cancelled{color:var(--faint)}
  .tool .bd{display:none;padding:0 11px 10px;font-size:11.5px;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;
    word-break:break-all;border-top:1px solid var(--line);padding-top:9px;margin-top:0}
  .tool.open .bd{display:block}
  /* 思考块：比工具卡片更弱化，展开后按正文排版（推理是散文，不是代码） */
  .tool.think{background:transparent}
  .tool.think .nm{color:var(--faint);font-family:inherit;font-weight:400}
  .tool.think .bd{font-family:inherit;font-size:12px;line-height:1.6;
    color:var(--faint);white-space:pre-wrap;word-break:break-word}
  /* 正在思考：标签提亮一点，让「还在想」和「想完了」有区别 */
  .tool.think[data-live] .nm{color:var(--dim)}
  .tool.think .ex{text-align:right}
  .sys{font-size:11px;color:var(--faint);text-align:center;margin:14px 0}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--faint);
    font-size:10.5px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .err{margin:0 0 10px;padding:9px 12px;border-radius:9px;background:#f8514912;
    border:1px solid #f8514933;color:#ffb4ae;font-size:12.5px}

  /* ---------- 待批准 ---------- */
  #pend{flex:0 0 auto;margin:0 12px 8px;padding:12px 13px;border-radius:var(--r);
    background:#2a2109;border:1px solid #d2992255}
  #pend .q{font-size:13px;line-height:1.5;color:#ffe9b8;white-space:pre-wrap;
    max-height:120px;overflow-y:auto}
  #pend .acts{display:flex;gap:8px;margin-top:11px}
  /*
    四个选项在手机上一行摆不开（"Always allow" 这种标签本身就长），所以两列网格。
    每个按钮显示 agent 给的原文标签，不做翻译或合并 —— 用户要能确切知道自己点的是
    单次还是永久。
  */
  #pend .acts.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #pend .acts.grid button{width:100%;font-size:13.5px;padding:11px 8px}
  #pend button{flex:1;padding:10px;border-radius:9px;font:inherit;font-size:14px;
    font-weight:500;border:1px solid var(--line2);background:var(--card2);color:var(--fg)}
  #pend button.ok{background:var(--green);border-color:var(--green);color:#05210c}
  #pend button.no{background:transparent;border-color:#f8514966;color:#ff9d95}

  /* ---------- 输入区 ---------- */
  footer{flex:0 0 auto;background:var(--bg);border-top:1px solid var(--line);
    padding:8px 12px calc(env(safe-area-inset-bottom) + 8px)}
  .cmp{display:flex;gap:8px;align-items:flex-end}
  .cmp textarea{flex:1;resize:none;max-height:132px;background:var(--card);color:var(--fg);
    border:1px solid var(--line);border-radius:11px;padding:10px 13px;font:inherit;
    font-size:15px;line-height:1.45}
  .cmp textarea::placeholder{color:var(--faint)}
  .cmp textarea:focus{outline:none;border-color:#35507a}
  .sendbtn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;
    background:var(--blue);color:#fff;font-size:17px;display:flex;align-items:center;
    justify-content:center;padding:0}
  .sendbtn:disabled{background:var(--card2);color:var(--faint)}
  /* 停止键：红色是为了让它和「发送」在肌肉记忆上分开，两者占同一个位置 */
  .sendbtn.stop{background:var(--red);font-size:12px}
  .sendbtn.stop:active{background:#c93c33}

  /* ---------- 新建会话面板 ---------- */
  #sheet{position:fixed;inset:0;z-index:50}
  .sh-bd{position:absolute;inset:0;background:#000a;backdrop-filter:blur(2px)}
  .sh-panel{position:absolute;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
    padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);
    max-height:82vh;overflow-y:auto;animation:up .24s cubic-bezier(.22,.61,.36,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sh-grab{width:36px;height:4px;border-radius:2px;background:var(--line2);
    margin:2px auto 12px}
  .sh-title{font-size:16px;font-weight:600;margin:0 0 16px}
  .sh-step{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg2);
    margin:18px 0 8px;font-weight:500}
  .sh-step:first-of-type{margin-top:0}
  .sh-step i{width:17px;height:17px;border-radius:50%;background:var(--line2);
    color:var(--fg2);font-size:10px;font-style:normal;display:flex;align-items:center;
    justify-content:center;flex:0 0 auto}
  .sh-hint{font-size:12px;color:var(--faint)}
  .sh-chips{display:flex;gap:7px;flex-wrap:wrap}
  .sh-chips button{font:inherit;font-size:12.5px;padding:7px 13px;border-radius:9px;
    background:var(--card2);border:1px solid var(--line);color:var(--fg2)}
  .sh-chips button.sel{background:#4a9eff1f;border-color:#4a9eff77;color:var(--blue)}
  .sh-models{display:flex;flex-direction:column;gap:6px}
  .sh-models button{font:inherit;font-size:14px;text-align:left;padding:11px 13px;
    border-radius:10px;background:var(--card2);border:1px solid var(--line);
    color:var(--fg2);display:flex;align-items:center;gap:9px}
  .sh-models button.sel{background:#4a9eff1a;border-color:#4a9eff77;color:var(--fg)}
  .sh-models .tick{margin-left:auto;color:var(--blue);opacity:0;font-size:13px}
  .sh-models button.sel .tick{opacity:1}
  .sh-models .src{font-size:10px;color:var(--faint)}
  .sh-models .desc{display:block;font-size:11px;color:var(--faint);margin-top:2px;
    line-height:1.4}
  .sh-models .mtxt{flex:1;min-width:0}
  .sh-go{width:100%;margin-top:20px;padding:13px;border-radius:11px;border:none;
    background:var(--blue);color:#fff;font:inherit;font-size:15px;font-weight:500}
  .sh-go:disabled{background:var(--card2);color:var(--faint)}

  #toast{position:fixed;left:50%;transform:translateX(-50%) translateY(6px);
    bottom:calc(env(safe-area-inset-bottom) + 76px);background:#1f2429;
    border:1px solid var(--line2);border-radius:11px;padding:10px 16px;font-size:13px;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;
    max-width:88vw;text-align:center;box-shadow:0 6px 24px #0009}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:var(--faint);font-size:13px;margin-top:56px;line-height:2}
</style>
</head>
<body>
<!-- Kiro 标记：定义一次，顶栏与每条助手消息复用 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="kiro" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="7.5" fill="#0f1113"/>
    <circle cx="16" cy="16" r="9.2" fill="#fff"/>
    <ellipse cx="12.7" cy="14.5" rx="1.7" ry="2.2" fill="#0f1113"/>
    <ellipse cx="19.3" cy="14.5" rx="1.7" ry="2.2" fill="#0f1113"/>
  </symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M12 5.5v13M5.5 12h13"/>
    </g>
  </symbol>
  <symbol id="ic-image" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
      <circle cx="8.6" cy="10" r="1.6"/>
      <path d="M3.6 17.2 9 12.4l4 3.4 3-2.4 4.4 3.8"/>
    </g>
  </symbol>
  <symbol id="ic-file" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M14 3.5H7.5A1.5 1.5 0 0 0 6 5v14a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 18 19V7.5z"/>
      <path d="M14 3.5V7a.5.5 0 0 0 .5.5H18"/>
    </g>
  </symbol>
  <symbol id="ic-archive" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="4" rx="1"/>
      <path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/>
      <path d="M10 12.5h4"/>
    </g>
  </symbol>
</svg>
<div id="app">
  <header>
    <div class="hrow">
      <button class="iconbtn hide" id="back" aria-label="返回">‹</button>
      <span class="brand">
        <svg><use href="#kiro"/></svg>
        <span class="dot off" id="dot"></span>
      </span>
      <div style="flex:1;min-width:0">
        <div class="htitle" id="title">连接中…</div>
        <div class="hsub hide" id="sub"></div>
      </div>
      <button class="iconbtn" id="searchBtn" aria-label="搜索">⌕</button>
      <button class="iconbtn" id="newBtn" aria-label="新建会话">+</button>
    </div>
    <div class="searchwrap hide" id="searchWrap">
      <input id="search" placeholder="搜索会话标题…" autocomplete="off" enterkeyhint="search">
    </div>
  </header>

  <!--
    授权框的按钮由后端送来的 options 动态生成，不写死。
    实测工具授权有四个选项（Allow / Always allow / Deny / Always deny），
    只摆「允许 / 拒绝」两个的话，用户没法知道自己批的到底是单次还是永久 ——
    而这两者的作用范围差别很大。
  -->
  <div id="pend" class="hide">
    <div class="q" id="pq"></div>
    <div class="acts" id="pacts"></div>
  </div>

  <main id="main"></main>

  <footer id="composer" class="hide">
    <div class="atts hide" id="atts"></div>
    <div class="cmp">
      <div class="attwrap">
        <button class="attbtn" id="attach" aria-label="添加附件">
          <svg><use href="#ic-plus"/></svg>
        </button>
        <div class="attmenu hide" id="attmenu">
          <button id="pickImg"><svg><use href="#ic-image"/></svg>图片</button>
          <button id="pickDoc"><svg><use href="#ic-file"/></svg>文件</button>
        </div>
      </div>
      <textarea id="input" rows="1" placeholder="发消息…"></textarea>
      <button class="sendbtn" id="send" disabled aria-label="发送">↑</button>
      <!--
        停止键顶替发送键，而不是并排多一个按钮：同一时刻只有一个动作是有意义的。
        这是「人离开桌子后 agent 跑偏了」唯一的自救手段 —— 后端一直支持 session:cancel，
        只是此前没有任何入口能发出它。
      -->
      <button class="sendbtn stop hide" id="stop" aria-label="停止本轮">■</button>
    </div>
    <!--
      两个入口而不是一个：Android 上 input[type=file] 不带 accept 时，多数浏览器会弹
      「相机 / 录音 / 照片和视频 / 更多」这种媒体优先面板，文件要点进「更多」才能到文件
      管理器，而各家行为还不一致。分成两个 input 后，「文件」这条路是确定的。
    -->
    <input type="file" id="file" class="hide" multiple accept="image/*">
    <!--
      文件入口刻意排除 image/audio/video。Android 按 accept 去匹配「能提供该类型内容」的
      应用：只要沾了媒体类型，相机 / 录音 / 相册就会占满选择面板，文件管理被挤进「更多」。
      不写 accept 也一样（等于 */*，媒体应用照样匹配）—— 实测过，那正是原来的问题。
      只留 text/* 与 application/* 时，系统才会直接落到文档选择器。
    -->
    <input type="file" id="doc" class="hide" multiple
      accept="text/*,application/*,.md,.log,.csv,.json,.yaml,.yml,.py,.js,.ts,.sh,.sql,.xml,.toml,.ipynb">

  </footer>
</div>
<div id="sheet" class="hide">
  <div class="sh-bd" id="shBd"></div>
  <div class="sh-panel">
    <div class="sh-grab"></div>
    <div class="sh-title">新建会话</div>
    <div class="sh-step"><i>1</i>工作区</div>
    <div class="sh-chips" id="wsChips"><span class="sh-hint">读取中…</span></div>
    <div class="sh-step"><i>2</i>模式</div>
    <div class="sh-chips" id="modeChips"><span class="sh-hint">读取中…</span></div>
    <div class="sh-step"><i>3</i>模型</div>
    <div class="sh-models" id="modelList"><span class="sh-hint">读取中…</span></div>
    <button class="sh-go" id="createBtn" disabled>创建并打开</button>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
// ---------------------------------------------------------------- 凭证
// token 只在扫码那一次出现在 URL 里，必须持久化：刷新、从桌面图标启动、
// 系统回收后台页面重载，都会丢掉 query。
const TOKEN_KEY = 'kiro-bridge-token';
const qs = new URLSearchParams(location.search);
let TOKEN = qs.get('token') || '';
if (TOKEN) {
  /*
   * 存好之后把 token 从地址栏抹掉。
   *
   * 为什么要抹:它留在 URL 里会顺着一切带 URL 的东西外泄 —— 截图、分享链接、
   * 浏览器历史、跨设备的历史同步。而 token 等于这台机器的命令执行权,
   * 这个代价和它带来的便利完全不成比例。
   *
   * 这里原先写着「刻意保留:外壳页是否需要 token 由 relay 决定,抹掉会刷新即 401」。
   * 那个顾虑现在已经不成立 —— relay 的 PUBLIC_PATHS 把 app.html / qr.js /
   * manifest.json / icon.svg 都放行了(PWA 从主屏启动时 start_url 不带 query,
   * 外壳页若要 token 会直接白屏)。实测不带 token 请求 `/` 与 `/app.html` 都是 200。
   * 真正的门在 WebSocket 与 /api/*,它们仍然强制校验。
   *
   * **必须先确认真的存下来了再抹。** 只 try/catch 不够:Safari 私密浏览这类环境下
   * setItem 可能不抛异常但也不真正保存,配额满时行为也不一致。若那时照样抹掉 URL,
   * token 就在两个地方同时消失 —— 当前页因为内存里还有变量而看起来正常,
   * 一刷新就得重新扫码,而且已经没有任何线索能找回它。所以回读一次做确认,
   * 成本为零,换掉一个只在特定设备上才暴露的静默故障。
   *
   * replaceState 不留历史记录,所以「后退」不会退回带 token 的那一条。
   */
  let stored = false;
  try {
    localStorage.setItem(TOKEN_KEY, TOKEN);
    stored = localStorage.getItem(TOKEN_KEY) === TOKEN;
  } catch (_) {
    stored = false;
  }
  if (stored) {
    try {
      const clean = location.pathname + location.hash;
      history.replaceState(null, '', clean);
    } catch (_) {
      /* 某些内嵌浏览器不给 replaceState,抹不掉就算了 —— token 已经存好,功能不受影响 */
    }
  }
} else {
  try { TOKEN = localStorage.getItem(TOKEN_KEY) || ''; } catch (_) {}
}
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') +
  location.host + '/?token=' + encodeURIComponent(TOKEN);

// ---------------------------------------------------------------- 状态
const el = (id) => document.getElementById(id);
const mainEl = el('main'), dotEl = el('dot'), titleEl = el('title'), subEl = el('sub');
let ws = null, reconnectDelay = 800, reqSeq = 1, failStreak = 0, reconnectTimer = null;
/**
 * 顶栏那个点表示的是**连接状态**，agent 忙闲只是它的修饰。
 *
 * 之前是直接被 agent 状态覆写的，于是「连着但空闲」和「断了」都是灰色，
 * 一眼看不出链路还在不在 —— 而连接状态恰恰是最该被一眼看见的那一项。
 *   断开        -> 红
 *   等待确认    -> 琥珀（有事要你处理）
 *   正在跑      -> 绿色脉动
 *   连着且空闲  -> 绿色常亮
 */
let connected = false;
let agentBusy = '';
function paintDot() {
  dotEl.className = connected ? 'dot ' + (agentBusy || 'on') : 'dot off';
}
let sessions = [], view = 'list', openId = null, openTitle = '';
/**
 * 当前会话是否有正在跑的回合 —— 决定输入区显示「发送」还是「停止」。
 *
 * 判据要多路合并，因为没有任何单一信号是及时且可靠的：
 *   列表推送   权威但有最多 5 秒延迟，且刚发出时文件还没落盘
 *   mux 增量   最及时，但只在 mux 通道可用时有
 *   turnEnd    结束的确定信号
 * 所以偏向「宁可多显示」：漏显示会让人在最需要停的时候没得可点。
 */
let turnActive = false, lastSendAt = 0;
let sessionsSig = '', searchQ = '';
/** 进入会话前所在的页面，决定返回键回到哪里 */
let chatFrom = 'list';

const ARCHIVED_KEY = 'kiro-bridge-archived';
const SHOW_EMPTY_KEY = 'kiro-bridge-show-empty';
function loadArchived() {
  try {
    const v = JSON.parse(localStorage.getItem(ARCHIVED_KEY) || '[]');
    return new Set(Array.isArray(v) ? v : []);
  } catch (_) { return new Set(); }
}
let archived = loadArchived();
const saveArchived = () => {
  try { localStorage.setItem(ARCHIVED_KEY, JSON.stringify([...archived])); } catch (_) {}
};
/*
 * 空会话默认**显示**。
 *
 * 原先默认折叠，理由是「空会话是噪音」。实际用起来反了：手机上刚建的新会话必然是空的
 * （还没发第一条消息），于是它一出生就被收起来，人得先想起来去点一下「空会话 N」
 * 才能找到自己刚创建的东西 —— 折叠恰好命中了最需要看见的那一类。
 *
 * 手动归档已经能解决「列表里东西太多」这个问题，不需要再按空/非空自动隐藏一批。
 * 那个 chip 保留着，想折叠随时可以点，选择会记在 localStorage 里。
 *
 * 注意这里的 `=== '1'` 换成了 `!== '0'`：没存过值时要走默认显示，
 * 而不是因为「读不到 '1'」就折叠。
 */
let showEmpty = (() => {
  try { return localStorage.getItem(SHOW_EMPTY_KEY) !== '0'; } catch (_) { return true; }
})();
const setShowEmpty = (v) => {
  showEmpty = v;
  try { localStorage.setItem(SHOW_EMPTY_KEY, v ? '1' : '0'); } catch (_) {}
};

/** 空会话：messages.jsonl 为 0 字节。实测这类会话标题恒为 New Session。 */
const isEmpty = (s) => !s.bytes;
/*
 * HTML 转义。**引号也转** —— 这一条是刻意的，起因是一次自查：
 * 有 7 处属性位置写的是 `data-id="${esc(x)}"`，而当时 esc 只转 & < >，不转引号。
 * 那些值当时都不是外部可控的自由文本（会话 id、时间戳、模型 id、base64 缩略图），
 * 所以不可利用；但它依赖「上游数据格式永远不含引号」这个假设，上游一变就是注入点。
 *
 * 与其立规矩「属性位置必须用 escAttr」，不如让**唯一的那个函数默认就是安全的** ——
 * 结构上不可能用错，比记得用对可靠。文本位置多转引号只是多几个实体，无副作用
 * （已确认 esc 的结果只用于拼 HTML，没有进 textContent 的地方）。
 */
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

/**
 * 实时状态。后端算好的 s.live 优先。
 * 后端还没更新（扩展未重载）时降级推断：session.json 的 status 是最后一次写入的
 * 快照，会话被中断会永久停在 in_progress，所以必须叠加时间窗才能用。
 */
function liveOf(s) {
  if (s.live) return s.live;
  const age = Date.now() - (s.lastActiveAt || 0);
  // 等确认刻意不设时间窗：agent 在等你审批时文件本来就不动，用静置时长去判断它
  // 等于专门把这个状态判错。后端的 liveState 同理。
  if (s.status === 'waiting_on_user') return 'waiting';
  if (s.status === 'in_progress' && age < 3 * 60 * 1000) return 'running';
  return 'idle';
}
/** 排序权重：待确认最前（需要你动手），其次运行中，其余按最近活动 */
const rankOf = (s) => ({ waiting: 0, running: 1 }[liveOf(s)] ?? 2);

function visible() {
  const q = searchQ.trim().toLowerCase();
  return sessions
    .filter((s) => {
      if (archived.has(s.sessionId)) return false;
      if (!showEmpty && isEmpty(s)) return false;
      if (q && !(s.title || '').toLowerCase().includes(q)) return false;
      return true;
    })
    .sort((a, b) => (rankOf(a) - rankOf(b)) || (b.lastActiveAt - a.lastActiveAt));
}

// ---------------------------------------------------------------- 工具
function toast(text, onTap) {
  const t = el('toast');
  t.textContent = text;
  t.classList.add('on');
  t.style.pointerEvents = onTap ? 'auto' : 'none';
  t.onclick = onTap ? () => { t.classList.remove('on'); t.onclick = null; onTap(); } : null;
  clearTimeout(toast._h);
  toast._h = setTimeout(() => { t.classList.remove('on'); t.onclick = null; },
    onTap ? 4200 : 1800);
}

function send(type, extra) {
  if (!ws || ws.readyState !== 1) { toast('未连接'); return null; }
  const reqId = 'r' + (reqSeq++);
  ws.send(JSON.stringify(Object.assign({ type, reqId }, extra || {})));
  return reqId;
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const now = new Date();
  const diff = (now - d) / 1000;
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
  if (d.toDateString() === now.toDateString()) return hm;
  const y = new Date(now - 86400000);
  if (d.toDateString() === y.toDateString()) return `昨天 ${hm}`;
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}/${d.getDate()}`;
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

const shortModel = (m) => String(m || '')
  .replace(/^claude-/, '').replace(/-latest$/, '');

// ---------------------------------------------------------------- 列表
function renderList(keepScroll) {
  view = 'list';
  openId = null;
  el('back').classList.add('hide');
  el('searchBtn').classList.remove('hide');
  el('newBtn').classList.remove('hide');
  el('composer').classList.add('hide');
  el('pend').classList.add('hide');

  const list = visible();
  titleEl.textContent = 'Kiro Remote';
  // 统计自己算，不用后端的 status 聚合：扩展重载前后端仍按旧判据计数
  const runN = list.filter((s) => liveOf(s) === 'running').length;
  const waitN = list.filter((s) => liveOf(s) === 'waiting').length;
  const bits = [`${list.length} 个会话`];
  if (waitN) bits.push(`${waitN} 待确认`);
  if (runN) bits.push(`${runN} 运行中`);
  subEl.textContent = bits.join(' · ');
  subEl.classList.remove('hide');
  agentBusy = waitN ? 'waiting' : runN ? 'running' : '';
  paintDot();

  const emptyN = sessions.filter(isEmpty).length;
  const archN = sessions.filter((s) => archived.has(s.sessionId)).length;
  const chips = [];
  if (emptyN) {
    chips.push(`<button class="chip${showEmpty ? ' on' : ''}" data-f="empty">空会话 ${emptyN}</button>`);
  }
  if (archN) chips.push(`<button class="chip" data-f="arch">已归档 ${archN} ›</button>`);
  const fbar = chips.length
    ? `<div class="fbar"><span class="sp">${chips.join('')}</span></div>`
    : '';

  // 扁平列表。按 workspace 分组会破坏「活跃置顶」——组内排序、组间按插入顺序，
  // 在跑的会话可能落到下面的分组里。workspace 降级成卡片上的一个标签。
  const parts = [fbar];
  for (const s of list) {
    // 只标注真正需要注意的两种状态。已完成 / 失败 / 空闲一律不给标记 ——
    // 大多数会话都处于这些状态，标出来只是噪音。
    const live = liveOf(s);
    const label = { running: '运行中', waiting: '待确认' }[live] || '';
    parts.push(
      `<div class="sw" data-id="${esc(s.sessionId)}">
         <div class="sw-act"><svg><use href="#ic-archive"/></svg></div>
         <div class="card${label ? ' s-' + live : ''}">
           <div class="bar"></div>
           <div class="ttl">${esc(s.title)}</div>
           <div class="meta">
             <span class="t">${fmtTime(s.lastActiveAt)}</span>
             ${s.workspaceName ? `<span class="sep">·</span><span class="ws">${esc(s.workspaceName)}</span>` : ''}
             ${s.modelId ? `<span class="sep">·</span><span class="model">${esc(shortModel(s.modelId))}</span>` : ''}
             ${s.agentMode === 'spec' ? `<span class="sep">·</span><span>spec</span>` : ''}
             ${label ? `<span class="badge ${live}">${label}</span>` : ''}
           </div>
         </div>
       </div>`
    );
  }
  if (!list.length) {
    parts.push(`<div class="empty">${searchQ ? '没有匹配的会话' :
      '这里没有会话<br>可以点上面的筛选看看被折叠的部分'}</div>`);
  }

  const y = keepScroll ? mainEl.scrollTop : 0;
  mainEl.innerHTML = parts.join('');
  mainEl.scrollTop = y;

  mainEl.querySelectorAll('.chip').forEach((b) => {
    b.onclick = () => {
      if (b.dataset.f === 'empty') { setShowEmpty(!showEmpty); renderList(); }
      else renderArchived();
    };
  });
  mainEl.querySelectorAll('.sw').forEach(bindSwipe);
}

/**
 * 左滑手势：跟手位移，松手时按阈值吸附。
 * 只在水平位移明显大于垂直位移时才接管，否则让页面正常滚动。
 */
function bindSwipe(wrap) {
  const card = wrap.querySelector('.card');
  const W = 92;           // 归档按钮宽度
  const OPEN_AT = 40;     // 松手后停在打开位置的阈值
  const FIRE_AT = 150;    // 直接触发归档的阈值
  let x0 = 0, y0 = 0, dx = 0, base = 0;
  let axis = null;        // null 未定 / 'x' 水平 / 'y' 垂直
  let moved = false;

  const setX = (v, anim) => {
    card.classList.toggle('anim', !!anim);
    card.style.transform = `translateX(${v}px)`;
  };

  wrap.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    axis = null;
    moved = false;
    base = card.dataset.open === '1' ? -W : 0;
    card.classList.remove('anim');
  }, { passive: true });

  wrap.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const cx = e.touches[0].clientX - x0;
    const cy = e.touches[0].clientY - y0;
    if (axis === null) {
      if (Math.abs(cx) < 6 && Math.abs(cy) < 6) return;
      axis = Math.abs(cx) > Math.abs(cy) * 1.4 ? 'x' : 'y';
    }
    if (axis !== 'x') return;
    moved = true;
    dx = base + cx;
    if (dx > 0) dx = dx * 0.25;                    // 右滑阻尼
    if (dx < -FIRE_AT - 60) dx = -FIRE_AT - 60;    // 左滑上限
    setX(dx, false);
  }, { passive: true });

  const finish = () => {
    if (axis !== 'x' || !moved) return;
    if (dx <= -FIRE_AT) {
      setX(-window.innerWidth, true);
      setTimeout(() => archive(wrap.dataset.id), 160);
      return;
    }
    const open = dx <= -OPEN_AT;
    card.dataset.open = open ? '1' : '0';
    setX(open ? -W : 0, true);
  };
  wrap.addEventListener('touchend', finish);
  wrap.addEventListener('touchcancel', finish);

  // 点归档按钮
  wrap.querySelector('.sw-act').addEventListener('click', (e) => {
    e.stopPropagation();
    archive(wrap.dataset.id);
  });
  // 点卡片：已划开时先收起，否则进入会话
  card.addEventListener('click', (e) => {
    if (moved) { moved = false; return; }
    if (card.dataset.open === '1') {
      card.dataset.open = '0';
      setX(0, true);
      return;
    }
    openSession(wrap.dataset.id);
  });
}

function archive(sessionId) {
  const s = sessions.find((x) => x.sessionId === sessionId);
  archived.add(sessionId);
  saveArchived();
  if (navigator.vibrate) navigator.vibrate(24);
  renderList(true);
  toast(`已归档「${(s ? s.title : sessionId).slice(0, 12)}」，点此撤销`, () => {
    archived.delete(sessionId);
    saveArchived();
    renderList(true);
  });
}

/*
 * 未发送的草稿按会话隔离。
 *
 * 输入框的文本在 DOM 里、附件在全局的 `atts` 数组里，两者都不跟着会话走 ——
 * 于是在 A 会话里打了一半的字和挑好的图，切到 B 会话还在那儿，一按发送就发错了地方。
 * 附件尤其危险：它没有可见的"属于哪个会话"的标记，看起来就像是本会话的东西。
 *
 * 存内存不存 localStorage：附件是 base64，几 MB 一张，几个会话就能顶爆存储配额，
 * 而配额写满的报错在移动端浏览器里表现不一（有的抛异常、有的静默丢弃）。
 * 刷新页面丢草稿是可以接受的，发错会话不行。
 */
const drafts = new Map();

/** 把当前输入框与附件存进 owner 那个会话的草稿位；空草稿直接删掉，别让 Map 无限长 */
function stashDraft(owner) {
  if (!owner) return;
  const text = input ? input.value : '';
  if (!text && !atts.length) drafts.delete(owner);
  else drafts.set(owner, { text, atts: atts.slice() });
}

/** 取出某个会话的草稿填回输入框；没有草稿就清空，**不能保留上一个会话的内容** */
function restoreDraft(owner) {
  const d = (owner && drafts.get(owner)) || null;
  atts = d ? d.atts.slice() : [];
  if (input) {
    input.value = d ? d.text : '';
    input.style.height = 'auto';
    if (d && d.text) input.style.height = Math.min(input.scrollHeight, 132) + 'px';
  }
  renderAtts();
  syncSendState();
}

// ---------------------------------------------------------------- 会话详情
function openSession(sessionId, from) {
  chatFrom = from || 'list';
  const s = sessions.find((x) => x.sessionId === sessionId);
  // 切走之前先把当前会话的草稿收好。openSession 也用于「从一个会话直接跳到另一个」，
  // 所以这里必须处理 openId 与 sessionId 不同的情况。
  if (openId && openId !== sessionId) stashDraft(openId);
  openId = sessionId;
  openTitle = s ? s.title : sessionId;
  view = 'chat';
  titleEl.textContent = openTitle;
  subEl.textContent = s ? `${s.workspaceName} · ${shortModel(s.modelId) || 'default'}` : '';
  subEl.classList.remove('hide');
  el('back').classList.remove('hide');
  el('searchBtn').classList.add('hide');
  el('newBtn').classList.add('hide');
  el('searchWrap').classList.add('hide');
  el('composer').classList.remove('hide');
  // 恢复这个会话自己的草稿（没有就清空）。必须在 composer 显示之后做，
  // 因为算 textarea 高度要元素已经可见。
  restoreDraft(sessionId);
  mainEl.innerHTML = '<div class="sys">加载历史…</div>';
  // 进来就按列表的判断定一次：最常见的场景正是「电脑上跑着，人从手机进来看」
  setTurnActive(!!s && liveOf(s) === 'running');
  send('session:open', { sessionId, limit: 400 });
}

const TOOL_ICON = { execute: '❯', edit: '✎', read: '◉', search: '⌕', fetch: '↓',
  delete: '✕', other: '⚙' };

/**
 * 极小的内联 markdown：**加粗** 与 `行内代码`。
 * 顺序上先 esc 再替换，保证标记只可能来自模型输出的语法，不可能来自注入的 HTML。
 * 只做这两种 —— 它们占了实际输出里的绝大多数，块级语法（表格/列表）留给后续。
 */
function mdInline(s) {
  return esc(String(s == null ? '' : s))
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*(?=\S)([^*\n]+?)\*\*/g, '<strong>$1</strong>');
}

/** 属性里还要转义引号，否则文本里的 " 能从 data-raw 里逃出去 */
const escAttr = (s) => esc(s).replace(/"/g, '&quot;');

const RE_UL = /^\s*[-*]\s+/;
const RE_OL = /^\s*\d+\.\s+/;
const RE_QUOTE = /^\s*>\s?/;
/** 表格分隔行：必须同时有竖线和横线，否则单独的 --- 会被误判成表格 */
const RE_TSEP = /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/;

/**
 * 极小的块级 markdown：表格、代码块、标题、列表、引用，其余按段落走。
 *
 * 两个约束决定了写法：
 *  1. 流式期间会拿**半截文本**反复调用它（代码块可能还没收尾），所以任何未闭合结构都要
 *     能安全收尾，不能死循环、也不能吞掉后面的内容。
 *  2. 先 esc 再拼标签，标记只可能来自 markdown 语法，不可能来自模型输出的 HTML。
 */
function mdRender(src) {
  const lines = String(src == null ? '' : src).split('\n');
  const out = [];
  let para = [];
  const flush = () => {
    if (!para.length) return;
    out.push('<p class="pp">' + para.map(mdInline).join('\n') + '</p>');
    para = [];
  };
  const cells = (row) =>
    row
      .replace(/^\s*\|/, '')
      .replace(/\|\s*$/, '')
      .split('|')
      .map((c) => c.trim());

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      flush();
      const body = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) body.push(lines[i++]);
      i++; // 收尾 fence；流式时可能还不存在，越界也无妨
      out.push('<pre class="cb"><code>' + esc(body.join('\n')) + '</code></pre>');
      continue;
    }

    const sep = lines[i + 1];
    if (line.includes('|') && sep && sep.includes('|') && RE_TSEP.test(sep)) {
      flush();
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|')) rows.push(cells(lines[i++]));
      out.push(
        '<div class="tw"><table><thead><tr>' +
          head.map((c) => '<th>' + mdInline(c) + '</th>').join('') +
          '</tr></thead><tbody>' +
          rows
            .map((r) => '<tr>' + r.map((c) => '<td>' + mdInline(c) + '</td>').join('') + '</tr>')
            .join('') +
          '</tbody></table></div>'
      );
      continue;
    }

    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {
      flush();
      out.push('<div class="mh">' + mdInline(h[2]) + '</div>');
      i++;
      continue;
    }

    if (RE_QUOTE.test(line)) {
      flush();
      const body = [];
      while (i < lines.length && RE_QUOTE.test(lines[i])) {
        body.push(lines[i++].replace(RE_QUOTE, ''));
      }
      out.push('<blockquote>' + body.map(mdInline).join('\n') + '</blockquote>');
      continue;
    }

    if (RE_UL.test(line) || RE_OL.test(line)) {
      flush();
      const ordered = RE_OL.test(line);
      const re = ordered ? RE_OL : RE_UL;
      const items = [];
      while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, ''));
      const tag = ordered ? 'ol' : 'ul';
      out.push(
        '<' + tag + ' class="ml">' +
          items.map((t) => '<li>' + mdInline(t) + '</li>').join('') +
          '</' + tag + '>'
      );
      continue;
    }

    if (line.trim() === '') {
      flush();
      i++;
      continue;
    }
    para.push(line);
    i++;
  }
  flush();
  return out.join('');
}

/** 思考耗时（秒）。算不出来返回 0，不编一个假数字。 */
function thinkSecs(startTs, endTs) {
  const a = startTs ? Date.parse(startTs) : NaN;
  const b = endTs ? Date.parse(endTs) : NaN;
  if (!a || !b || b < a) return 0;
  return Math.round((b - a) / 1000);
}

/**
 * 把已经结束的思考块收起来。
 * 数据里没有「思考结束」这个标记，判据只能是「它后面已经出现了别的内容」——
 * 所以流式期间最后一块保持展开（能看到模型在想什么），一旦有正文或工具跟上就折叠。
 */
function settleThinking(scope, keepLastLive) {
  const blocks = [...scope.querySelectorAll('.think[data-live]')];
  for (const b of blocks) {
    // 判据是「它后面还有没有内容」，不是「它是不是最后一块思考」。
    // 后者会让最近那块一直展开到下一次思考出现为止（实测踩过）。
    if (keepLastLive && b === scope.lastElementChild) continue;
    b.removeAttribute('data-live');
    b.classList.remove('open');
    const secs = thinkSecs(b.dataset.start, b.dataset.end);
    const nm = b.querySelector('.nm');
    const ex = b.querySelector('.ex');
    if (nm) nm.textContent = 'Thought complete';
    if (ex) ex.textContent = secs >= 1 ? `${secs}s` : '';
  }
}

/**
 * mux 的实时增量。文件 tail 里思考是整块落盘的（实测 76/76 跨度 0 秒），
 * 想要真流式只能走这条通路：agent_thought_chunk 是逐块推来的思考。
 * 这里只认思考，正文仍由 tail 负责 —— 两边都接会让去重复杂一倍。
 */
function applyMuxUpdate(params) {
  if (!params || params.sessionId !== openId) return;
  const u = params.update;
  if (!u) return;
  const c = u.content;
  const text = c && c.type === 'text' ? c.text : '';
  if (!text) return;
  // 有增量在推 = 这一轮确实在跑，这是最及时的一路信号
  setTurnActive(true);
  if (u.sessionUpdate === 'agent_thought_chunk') streamThought(text);
  else if (u.sessionUpdate === 'agent_message_chunk') streamSay(text);
}

/**
 * 正文增量。与思考同构，只是渲染成助手气泡。
 *
 * 注意必须把原始文本累积在 data-raw 里、每次整体重渲染：markdown 标记会被切在两个
 * 增量之间（`**粗` + `体**`），逐块追加 HTML 会渲染错。
 */
function streamSay(text) {
  const atBottom = mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight < 140;
  let block = mainEl.lastElementChild;
  const live = block && block.classList.contains('arow') && block.dataset.stream;
  if (!live) {
    const holder = document.createElement('div');
    holder.innerHTML = nodeFor({ kind: 'message', role: 'assistant', text: '' });
    block = holder.firstElementChild;
    block.dataset.stream = '1';
    mainEl.appendChild(block);
  }
  const body = block.querySelector('.a');
  body.dataset.raw = (body.dataset.raw || '') + text;
  body.innerHTML = mdRender(body.dataset.raw);
  if (atBottom) scrollBottom();
}

/** 把一块思考增量追加到「正在思考」的占位块上，没有就新建一个 */
function streamThought(text) {
  const atBottom = mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight < 140;
  let block = mainEl.lastElementChild;
  const live = block && block.classList.contains('think') && block.dataset.stream;
  if (!live) {
    const now = new Date().toISOString();
    const holder = document.createElement('div');
    holder.innerHTML = nodeFor({ kind: 'reasoning', text: '', startTs: now, ts: now });
    block = holder.firstElementChild;
    block.dataset.stream = '1';
    mainEl.appendChild(block);
    bindTools(mainEl);
  }
  block.querySelector('.bd').textContent += text;
  block.dataset.end = new Date().toISOString();
  if (atBottom) scrollBottom();
}

/**
 * 删掉实时占位块。
 * mux 的实时内容和 tail 的权威内容是同一段文字，会来两次；占位块只负责「正在思考」
 * 这段体验，权威版本一到就把它撤掉，避免同一段思考出现两遍。
 */
function dropStreamPlaceholders() {
  for (const b of mainEl.querySelectorAll('[data-stream]')) b.remove();
}

/**
 * 选项的显示标签。两类交互的字段名不一样，实测：
 *   tool_approval  {optionId, name, kind}        —— 工具授权，没有 title
 *   user_input     {title, description, ...}     —— 让你选方向的提问
 * 原来只读 title，于是所有工具授权卡片的选项都显示成空的「 /  /  / 」，
 * 而那正是最需要看清「有哪些选项」的场合。
 */
function optionLabels(options) {
  return (options || [])
    .map((o) => (o && (o.name || o.title)) || '')
    .filter(Boolean)
    .join(' / ');
}

/** 用户消息的附件提示：只看文字分不出图到底有没有传上去 */
function attNote(m) {
  const n = (m.images || 0) + (m.documents || 0);
  return n ? `<div class="sz">已附 ${n} 个文件</div>` : '';
}

function nodeFor(m) {
  switch (m.kind) {
    case 'message':
      return m.role === 'user'
        ? `<div class="u"><div class="b">${mdInline(m.text)}${attNote(m)}</div></div>`
        : `<div class="arow"><span class="ava"><svg><use href="#kiro"/></svg></span>` +
          `<div class="a" data-raw="${escAttr(m.text || '')}">${mdRender(m.text)}</div></div>`;
    case 'tool': {
      const ic = TOOL_ICON[m.toolKind] || '⚙';
      const st = m.status && m.status !== 'completed' && m.status !== 'approved'
        ? `<span class="st ${esc(m.status)}">${esc(m.status)}</span>` : '';
      return `<div class="tool">
          <div class="hd"><span class="caret">▶</span>
            <span class="nm">${ic} ${esc(m.toolName || m.actionType || 'tool')}</span>
            <span class="ex">${esc(m.explanation || '')}</span>${st}</div>
          <div class="bd">${esc(m.preview || '')}</div>
        </div>`;
    }
    // 思考默认折叠：它是给模型自己看的推理，混在正文里会把真正的回答冲掉。
    // 复用工具卡片的 .tool 结构，折叠交互直接由 bindTools 接管。
    case 'reasoning':
      return `<div class="tool think open" data-live="1"
        data-start="${esc(m.startTs || '')}" data-end="${esc(m.ts || '')}">
        <div class="hd"><span class="caret">▶</span>
        <span class="nm">Thinking…</span>
        <span class="ex"></span></div>
        <div class="bd">${esc(m.text)}</div></div>`;
    case 'toolResult':
      return m.success ? '' : `<div class="err">工具失败：${esc(m.preview)}</div>`;
    case 'pending':
      return pendingCard(m);
    case 'resolved':
      return `<div class="sys">已确认：${esc(m.selectedOption || m.outcome)}</div>`;
    case 'turnEnd':
      return m.stopReason && m.stopReason !== 'end_turn'
        ? `<div class="sys">本轮结束：${esc(m.stopReason)}</div>` : '';
    case 'error':
      return `<div class="err">${esc(m.text)}</div>`;
    case 'tombstone':
      return '<div class="divider">上下文已清理</div>';
    case 'subAgent':
      return `<div class="sys">子代理 ${esc(m.phase === 'start' ? '启动' : '结束')}${
        m.name ? ' · ' + esc(m.name) : ''}${m.error ? ' · ' + esc(m.error) : ''}</div>`;
    default:
      return '';
  }
}

function bindTools(scope) {
  scope.querySelectorAll('.tool .hd').forEach((hd) => {
    if (hd.dataset.bound) return;
    hd.dataset.bound = '1';
    hd.onclick = () => hd.parentElement.classList.toggle('open');
  });
}

function renderHistory(msgs, truncated) {
  // 先把审批结局并进对应的待确认卡片，否则会出现「⏸ 待确认」卡片 +「已确认」一行并存
  const items = mergeResolved(msgs);
  mainEl.innerHTML = (truncated ? '<div class="divider">仅显示最近部分</div>' : '') +
    (items.map(nodeFor).join('') || '<div class="empty">这个会话还没有内容</div>');
  // 历史里的思考全部已经结束，一律收起
  settleThinking(mainEl, false);
  bindTools(mainEl);
  scrollBottom();
}

function appendDelta(msgs) {
  reconcilePending(msgs);
  /*
   * 结局到达时先去更新那张已经渲染好的授权卡片；更新成功的就不再作为新消息追加 ——
   * 否则卡片下面会多出一行「已确认：xxx」，而卡片本身还写着「待确认」。
   * 与 mergeResolved() 互补：那个管整批渲染（打开会话），这个管人正看着时的增量。
   */
  msgs = (msgs || []).filter((m) => !markPendingResolvedInDom(m));
  // turnEnd 是回合结束的确定信号，比列表推送早、也比它可靠
  if (msgs.some((m) => m.kind === 'turnEnd')) setTurnActive(false);
  // tail 带来了权威内容（思考或正文），或回合已结束 → 撤掉实时占位，避免同一段出现两遍。
  // 必须在下面的合并循环之前做：否则权威的 .arow 会被并进占位块而不是替换它。
  if (
    msgs.some(
      (m) =>
        m.kind === 'reasoning' ||
        m.kind === 'turnEnd' ||
        (m.kind === 'message' && m.role === 'assistant')
    )
  ) {
    dropStreamPlaceholders();
  }
  const atBottom = mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight < 140;
  const frag = document.createElement('div');
  frag.innerHTML = msgs.map(nodeFor).join('');
  while (frag.firstChild) {
    const node = frag.firstChild;
    const last = mainEl.lastElementChild;
    // 连续的助手片段并进上一段正文，避免刷出一串各带头像的独立块
    if (node.classList && node.classList.contains('arow') &&
        last && last.classList.contains('arow')) {
      // 合并原始文本后整体重渲染，而不是拼 HTML：块级结构（表格、代码块）会被切在两段
      // 之间，拼 HTML 只会得到两个残缺的表格。
      const lb = last.querySelector('.a');
      const nb = node.querySelector('.a');
      lb.dataset.raw = (lb.dataset.raw || '') + (nb.dataset.raw || '');
      lb.innerHTML = mdRender(lb.dataset.raw);
      frag.removeChild(node);
      continue;
    }
    // 思考同理：tail 分批到达，不合并会刷出一串各自独立的思考小卡片。
    // 能走到这里说明上一块还是 live 的（settle 过的后面一定跟了别的类型）。
    if (node.classList && node.classList.contains('think') &&
        last && last.classList.contains('think')) {
      last.querySelector('.bd').textContent += node.querySelector('.bd').textContent;
      if (node.dataset.end) last.dataset.end = node.dataset.end;
      frag.removeChild(node);
      continue;
    }
    mainEl.appendChild(node);
  }
  // 最后一块思考保持展开（正在想），其余收起
  settleThinking(mainEl, true);
  bindTools(mainEl);
  if (atBottom) scrollBottom();
}

const scrollBottom = () =>
  requestAnimationFrame(() => { mainEl.scrollTop = mainEl.scrollHeight; });

// ---------------------------------------------------------------- 停止本轮
function setTurnActive(v) {
  if (v === turnActive) return;
  turnActive = v;
  el('send').classList.toggle('hide', v);
  el('stop').classList.toggle('hide', !v);
}

/**
 * 用列表推送校正一次。只在「确认还在跑」时开，关掉要多等一会儿 ——
 * 刚发出去的那几秒 messages.jsonl 还没落盘，列表会说 idle，而那正是最需要停止键的时候。
 */
function syncTurnFromList() {
  const s = sessions.find((x) => x.sessionId === openId);
  if (!s) return;
  if (liveOf(s) === 'running') setTurnActive(true);
  else if (Date.now() - lastSendAt > 12000) setTurnActive(false);
}

el('stop').onclick = () => {
  if (!openId) return;
  send('session:cancel', { sessionId: openId });
  // 不等应答就先收起：点了没反应最容易让人连点，而 cancel 是 notify，没有成功回执
  setTurnActive(false);
};

// ---------------------------------------------------------------- 待批准
let pendingItem = null;
/**
 * 还没轮到显示的授权请求。框一次只显示一个，关掉一个自动接上下一个。
 *
 * 需要队列是因为重连时可能一次收到多条：同一个会话通常只有一个（agent 要等到
 * 批准才会继续往下跑），但手机离线期间如果电脑侧也在推进，就可能攒下几条。
 * 只弹第一条的话，用户批完它，剩下的又回到「看得到卡片点不到按钮」那个状态。
 */
let pendingQueue = [];
/**
 * 用后端送来的全量重建待批状态。
 *
 * 覆盖而不是追加：这份数据是后端那张表的当前快照，是权威的。追加会让已经消失的
 * 请求留在队列里，用户点了只能拿到一个报错。
 *
 * **不要用 `pendingItem` 是否为空来判断「框还在显示、不用重画」。**
 * 这两件事并不等价：renderList() 会 el('pend').classList.add('hide') 把框藏掉，
 * 但不清 pendingItem。于是从会话返回列表再切回来时，框是 hide 状态而 pendingItem
 * 还在，任何「已经有了就跳过」的写法都会让框再也回不来 —— 实测踩过，
 * 表现是「退出重进 URL 能恢复，返回列表再进去不能」。
 * 靠 showPending() 幂等来做重建，比维护一个「是否可见」的标志可靠。
 */
function queuePending(list) {
  const items = (list || []).filter((p) => p && p.toolCallId);
  if (!items.length) {
    pendingQueue = [];
    // 后端说这个会话没有待处理的了，本地要跟上，否则会留一个点不动的框
    if (pendingItem) hidePending();
    return;
  }
  // 正在看的那条还在就继续显示它，否则从头开始
  const cur = pendingItem && pendingItem.toolCallId;
  const head = (cur && items.find((p) => p.toolCallId === cur)) || items[0];
  pendingQueue = items.filter((p) => p.toolCallId !== head.toolCallId);
  // 同一条只是重画时不震动：从列表切回会话会走到这里，每次都震很烦
  showPending(head, head.toolCallId !== cur);
}
/** 弹出队首。队列空就什么也不做。 */
function nextPending() {
  const p = pendingQueue.shift();
  if (p) showPending(p);
}
/**
 * 按 kind / optionId 判断某个选项是「放行」还是「拒绝」，只用来决定按钮配色。
 * 判不出来就当中性，不猜。
 */
function optionTone(o) {
  const s = `${(o && o.kind) || ''} ${(o && o.optionId) || ''}`.toLowerCase();
  if (/allow|approve|accept/.test(s)) return 'ok';
  if (/reject|deny|cancel/.test(s)) return 'no';
  return '';
}

/** 在 options 里按 optionId 找回那个选项对象（历史卡片要显示用户当时点了哪个） */
function optionOf(optionId, options) {
  return (Array.isArray(options) ? options : []).find((o) => o && o.optionId === optionId) || null;
}

/**
 * 历史里的授权卡片：待确认 / 已允许 / 已拒绝 / 已取消。
 *
 * 会话文件里 `pending_interaction` 和 `interaction_resolved` 是两条独立记录,
 * 后端也照原样送两条过来。**各渲染一次的结果是自相矛盾的**:一张写着「⏸ 待确认」
 * 的卡片,下面紧跟一行「已确认:always-accept」—— 而用户第一眼看到的是那张
 * 仍然写着待确认的卡片,会以为审批没生效。结局由 mergeResolved() 合并进 m.resolved。
 *
 * 选了哪个选项必须写出来:allow_once 和 allow_always 的后果差很多,
 * 事后只显示「已允许」是不够的。
 */
function resolvedView(r, options) {
  if (!r) return { icon: '⏸', word: '待确认', cls: '', pick: '' };
  if (r.outcome !== 'selected') {
    // 没选任何选项就有了结局:被取消或超时。批准没落地,不能显示成已允许。
    return { icon: '⊘', word: '已取消', cls: 'cancelled', pick: r.outcome || '' };
  }
  // options 拿不到时(增量更新路径)退回用 optionId 判断,optionTone 两个字段都看
  const opt = optionOf(r.selectedOption, options) || { optionId: r.selectedOption };
  const no = optionTone(opt) === 'no';
  return {
    icon: no ? '✗' : '✓',
    word: no ? '已拒绝' : '已允许',
    cls: no ? 'denied' : 'approved',
    pick: opt.name || opt.title || opt.optionId || '',
  };
}

function pendingCard(m) {
  const v = resolvedView(m.resolved, m.options);
  const st = m.resolved ? `<span class="st ${v.cls}">${esc(v.pick)}</span>` : '';
  // data-pending 让增量到达的结局能直接更新这张已经渲染好的卡片
  return `<div class="tool" data-pending="${escAttr(m.toolCallId || '')}">
      <div class="hd"><span class="caret">▶</span>
        <span class="nm">${v.icon} ${v.word}</span>
        <span class="ex">${esc(m.question || '')}</span>${st}</div>
      <div class="bd">${esc(optionLabels(m.options))}</div>
    </div>`;
}

/**
 * 把 interaction_resolved 的结局并进对应的 pending 记录,并去掉已合并的那条独立记录。
 *
 * 没找到对应 pending 的 resolved **保留**:历史可能只截取了尾部窗口,
 * pending 落在窗口外。那时丢掉 resolved 会让这次审批彻底看不见。
 */
function mergeResolved(msgs) {
  if (!Array.isArray(msgs)) return msgs;
  const byId = new Map();
  for (const m of msgs) {
    if (m && m.kind === 'resolved' && m.toolCallId) byId.set(m.toolCallId, m);
  }
  if (!byId.size) return msgs;
  const merged = [];
  const consumed = new Set();
  for (const m of msgs) {
    if (m && m.kind === 'pending' && m.toolCallId && byId.has(m.toolCallId)) {
      const r = byId.get(m.toolCallId);
      consumed.add(m.toolCallId);
      merged.push({
        ...m,
        resolved: { outcome: r.outcome, selectedOption: r.selectedOption, ts: r.ts },
      });
      continue;
    }
    merged.push(m);
  }
  return merged.filter(
    (m) => !(m && m.kind === 'resolved' && m.toolCallId && consumed.has(m.toolCallId))
  );
}

/**
 * 结局在增量里到达时,直接更新那张已经渲染好的卡片。
 *
 * 不能只靠 mergeResolved:它作用于整批渲染,而人正看着会话时结局是通过 delta 来的,
 * 此时卡片已经在 DOM 里。不更新的话,要等下一次重新打开会话才会变 ——
 * 而那正是用户看到「批完了还写着待确认」的时刻。
 */
function markPendingResolvedInDom(m) {
  if (!m || m.kind !== 'resolved' || !m.toolCallId) return false;
  const card = mainEl.querySelector(`.tool[data-pending="${cssAttrEscape(m.toolCallId)}"]`);
  if (!card) return false;
  const hd = card.querySelector('.hd');
  const nm = card.querySelector('.nm');
  if (!hd || !nm) return false;
  const v = resolvedView({ outcome: m.outcome, selectedOption: m.selectedOption });
  nm.textContent = `${v.icon} ${v.word}`;
  let st = card.querySelector('.st');
  if (!st) {
    st = document.createElement('span');
    hd.appendChild(st);
  }
  st.className = `st ${v.cls}`;
  st.textContent = v.pick;
  return true;
}

/** 属性选择器里的转义。toolCallId 由 agent 给出,不能假定它一定不含引号。 */
function cssAttrEscape(s) {
  return String(s).replace(/["\\]/g, '\\$&');
}

function showPending(p, notify = true) {
  pendingItem = p;
  el('pq').textContent = [p.title, p.detail].filter(Boolean).join('\n') || '需要确认';

  // 按后端送来的 options 逐个生成按钮。用户点哪个就回哪个 optionId，
  // 不在手机端替他推断 —— allow_once 和 allow_always 的后果差很多。
  const opts = Array.isArray(p.options) ? p.options.filter((o) => o && o.optionId) : [];
  const box = el('pacts');
  if (opts.length) {
    box.className = 'acts grid';
    box.innerHTML = opts.map((o) =>
      `<button class="${optionTone(o)}" data-opt="${escAttr(o.optionId)}">` +
      `${esc(o.name || o.title || o.optionId)}</button>`
    ).join('');
    box.querySelectorAll('button').forEach((b) => {
      const opt = opts.find((o) => o.optionId === b.dataset.opt);
      b.onclick = () => respondPending(b.dataset.opt, optionTone(opt) !== 'no');
    });
  } else {
    // 后端没给选项（老版本或非工具授权），退回两个粗粒度按钮
    box.className = 'acts';
    box.innerHTML = '<button class="ok" data-fallback="1">允许</button>' +
      '<button class="no" data-fallback="0">拒绝</button>';
    box.querySelectorAll('button').forEach((b) => {
      b.onclick = () => respondPending(null, b.dataset.fallback === '1');
    });
  }

  el('pend').classList.remove('hide');
  if (notify && navigator.vibrate) navigator.vibrate([40, 60, 40]);
}

/** 把用户点的那个选项发回去。optionId 为 null 时退回粗粒度的 approve 语义。 */
function respondPending(optionId, approve) {
  const payload = {
    sessionId: openId,
    toolCallId: pendingItem && pendingItem.toolCallId,
    approve,
  };
  if (optionId) payload.optionId = optionId;
  send('session:approve', payload);
  hidePending();
}
function hidePending() {
  pendingItem = null;
  el('pend').classList.add('hide');
  // 还有排队的就接上。留一点间隔，否则手指还在原位就可能误点到下一个框 ——
  // 而下一个框里可能是个 always 选项，误点的代价不对称。
  if (pendingQueue.length) setTimeout(nextPending, 320);
}
/**
 * 授权框对应的请求可能已经在 agent 侧被解决或取消了（实测：不匹配白名单的命令会在
 * 20ms 内被自动取消）。这时框还挂着，点了也不会生效。结局一到就关掉并说明真实结果，
 * 不要让「点了没反应」看起来像「点了就好了」。
 */
function reconcilePending(msgs) {
  if (!pendingItem) return;
  for (const m of msgs || []) {
    if (m.kind !== 'resolved' || m.toolCallId !== pendingItem.toolCallId) continue;
    hidePending();
    toast(
      m.outcome === 'cancelled'
        ? '该请求已被取消，批准未生效'
        : `已确认：${m.selectedOption || m.outcome}`
    );
    return;
  }
}
// 授权按钮已改为按 options 动态生成，绑定在 showPending 里完成。
// 原来这里写死了 #pok / #pno 两个按钮的 onclick，那两个元素已经不存在。

// ---------------------------------------------------------------- 连接
function showBlocker(text, hint) {
  // 统一走同一个状态源，避免 connected 与点上显示的东西各说各话
  connected = false;
  paintDot();
  titleEl.textContent = text;
  subEl.classList.add('hide');
  el('composer').classList.add('hide');
  mainEl.innerHTML = `<div class="empty">${esc(hint)}</div>`;
}

async function probeAuth() {
  try {
    const r = await fetch('api/auth?token=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
    return r.status;
  } catch (_) { return 0; }
}

/** 排一次重连。同一时刻只保留一个待执行的重连，避免多个定时器同时醒来连出几条。 */
function scheduleReconnect(delay) {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, delay);
}

/**
 * 立刻确保连接可用。
 *
 * 为什么不能只靠 setTimeout：**手机锁屏后浏览器会冻结后台页面的定时器**，
 * 解锁回来时那个 setTimeout 不一定恢复执行，页面就永远停在「已断开，重连中…」。
 * 实测正是如此 —— 停在那一页不动就一直不恢复，而返回上级页面再切回来就好了，
 * 因为那些交互让浏览器把页面完全唤醒，冻着的定时器才继续跑。
 *
 * 所以要在「页面重新可见」和「网络恢复」这两个**确定信号**上主动连一次，
 * 并把退避重置：人刚回到页面时还要等 8 秒才重连是没道理的。
 */
function ensureConnected() {
  // 0=CONNECTING 1=OPEN，这两种状态下不要再开一条
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  reconnectDelay = 800;
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }
  connect();
}

function connect() {
  if (!TOKEN) {
    showBlocker('缺少访问凭证',
      '这个页面需要扫码进入。\n在 Kiro 里执行「Kiro Bridge: 显示访问地址与二维码」，用手机扫一次。');
    return;
  }
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    reconnectDelay = 800;
    failStreak = 0;
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
    connected = true;
    paintDot();
    /*
     * 重连后必须重新发一次 session:open。
     *
     * 后端把「这台手机在看哪个会话」记在**连接**上（watchedSessionId），连接一断
     * 这份记账就没了。只恢复 WebSocket 的话，点会变绿，但 delta / muxUpdate /
     * 待批重放都不会来 —— 看起来是连上了，内容却不动，比断开更容易误判。
     * 这也是待批授权框在重连后回来的那条路（session:open 会带回 pending）。
     *
     * 顺便把副标题从「已断开，重连中…」恢复成本来的内容：它和连接提示共用一个位置。
     */
    if (view === 'chat' && openId) {
      const s = sessions.find((x) => x.sessionId === openId);
      subEl.textContent = s ? `${s.workspaceName} · ${shortModel(s.modelId) || 'default'}` : '';
      send('session:open', { sessionId: openId, limit: 400 });
    } else if (view === 'list') {
      renderList(true);
    }
  };
  ws.onclose = async () => {
    connected = false;
    paintDot();
    failStreak++;
    // 连续失败 3 次才探认证：切 App / 锁屏导致的正常断开不该被当成故障
    if (failStreak >= 3 && (await probeAuth()) === 401) {
      showBlocker('凭证已失效', 'relay 重启后 token 会变。\n请重新扫一次二维码。');
      return;
    }
    subEl.textContent = `已断开，重连中…（第 ${failStreak} 次）`;
    subEl.classList.remove('hide');
    scheduleReconnect(reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.6, 8000);
  };
  ws.onerror = () => {};
  ws.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch (_) { return; }
    switch (m.type) {
      // 握手：附件预算按服务端报来的真实帧上限算，不用前端自己那份写死的数字
      case 'hello':
        if (Number(m.maxPayload) > 0) {
          maxTotalB64 = Math.floor(Number(m.maxPayload) * FRAME_BUDGET_RATIO);
        }
        break;
      case 'sessions': {
        const next = m.items || [];
        // live 必须进签名。它是后端按时间窗算的，会在文件完全没动的情况下自己
        // 从 running 翻成 idle —— 不进签名的话那次翻转永远不会被渲染，列表上的
        // 「运行中」徽标会一直挂着。
        const sig = next.map((s) =>
          `${s.sessionId}:${s.lastActiveAt}:${s.status}:${s.bytes}:${s.live || ''}`).join('|');
        if (sig !== sessionsSig) {
          sessionsSig = sig;
          sessions = next;
          if (view === 'list') renderList(true);
          else if (view === 'archived') renderArchived();
        }
        // 刻意放在签名判断之外：会话安静下来之后签名就不再变化，而那恰恰是需要把
        // 停止键收回去的时刻。卡在「停止」上的代价是发送键消失，人就再也发不出消息。
        if (view === 'chat') syncTurnFromList();
        break;
      }
      // 刻意不采用：状态点与计数由 renderList 依据 liveOf 自己算，因为扩展重载之前
      // 后端仍按旧判据计数，两边会对不上。这里收下但不用，避免出现两个事实源。
      case 'status':
        break;
      case 'history':
        if (m.sessionId === openId) {
          renderHistory(m.messages || [], m.truncated);
          // 断线重连后授权框要自己回来。本地状态是空的（刷新就是全新上下文），
          // 权威数据在后端那张表里，这里跟历史一起收下。
          if (Array.isArray(m.pending)) queuePending(m.pending);
        }
        break;
      case 'delta':
        if (m.sessionId === openId) appendDelta(m.messages || []);
        break;
      // mux 实时增量：目前只用它做流式思考，正文仍走 tail
      case 'muxUpdate':
        applyMuxUpdate(m.params);
        break;
      case 'permission':
        showPending(m);
        break;
      case 'sent':
        toast(
          (m.attachments ? `已发送（含 ${m.attachments} 个附件）` : '已发送') +
            (m.via === 'mux' ? '' : '（命令通道）')
        );
        setTurnActive(true);
        break;
      case 'cancelled':
        toast('已请求停止');
        setTurnActive(false);
        break;
      // 「已发出」不等于「已被接受」—— 真实结局由 resolved 增量给出，见 reconcilePending
      // 「已发出」不等于「已生效」。带上实际发出的 optionId，这样电脑上框还挂着的时候
      // 能立刻看出是发错了选项，还是发对了但 agent 没接受。
      // 「已发出」不等于「已生效」。带上实际发出的 optionId 与持久化范围：
      // scope=user 表示这次是永久授权、会写进 permissions.yaml，值得让人看见。
      case 'approved':
        toast(
          (m.optionId ? `已发出：${m.optionId}` : '批准已发出') +
            (m.scope === 'user' ? ' · 永久' : '') +
            (m.granularity === 'single' ? '' : '（整批）') +
            ' · 等 agent 确认'
        );
        break;
      case 'workspaces':
        wsList = m.items || [];
        renderSheet();
        break;
      case 'presets':
        modeList = m.modes || [];
        modelList = m.models || [];
        // m.autopilot 后端仍会返回，前端不用 —— 执行方式沿用会话默认
        presetDefaults = m.defaults || {};
        renderSheet();
        break;
      case 'created':
        closeSheet();
        el('createBtn').textContent = '创建并打开';
        /*
         * notes 是「已经创建成功，但有件事你必须知道」——目前唯一的一条是跨窗口创建：
         * agent 实际会在 Bridge 所在窗口的工作区里干活，而不是你选的那个。
         * 它比 failed 更需要被看见（失败你会重试，而这个会静默产出错误的结果），
         * 所以用 alert 而不是 toast：toast 几秒就没了，人在路上很容易错过。
         */
        if (m.notes && m.notes.length) {
          setTimeout(() => alert('注意\n\n' + m.notes.join('\n\n')), 60);
        }
        if (m.failed && m.failed.length) toast(`会话已建，但${m.failed.join('；')}`);
        else if (m.applied && m.applied.length) toast(`已创建（${m.applied.join(' + ')}已设置）`);
        else toast('已创建');
        // 新会话还没进列表，先直接进去；下一次列表推送会带上它
        if (m.sessionId) {
          sessions = [{
            sessionId: m.sessionId, title: '新会话', workspaceName: '',
            agentMode: 'vibe', status: 'idle', live: 'idle', bytes: 1,
            lastActiveAt: Date.now(), workspacePaths: m.cwd ? [m.cwd] : [],
          }, ...sessions];
          openSession(m.sessionId);
        }
        break;
      case 'error':
        el('createBtn').disabled = false;
        el('createBtn').textContent = '创建并打开';
        toast(m.message || '出错了');
        break;
      default:
        break;
    }
  };
}

// ---------------------------------------------------------------- 新建会话
// 三项预设各自独立：工作区决定在哪个 IDE 窗口建、模式决定 agent 行为、模型决定用哪个 LLM。
// 只暴露三项预设。执行方式（Autopilot / Supervised）不在这里选，沿用会话默认值。
let wsList = [], modeList = [], modelList = [], presetDefaults = {};
let pickedWs = null, pickedMode = null, pickedModel = null;

function openSheet() {
  el('sheet').classList.remove('hide');
  for (const id of ['wsChips', 'modeChips', 'modelList']) {
    el(id).innerHTML = '<span class="sh-hint">读取中…</span>';
  }
  el('createBtn').disabled = true;
  pickedWs = pickedMode = pickedModel = null;
  send('workspaces:list');
  send('presets:list');
}
const closeSheet = () => el('sheet').classList.add('hide');

/** 渲染一组 chips，选中项高亮；返回是否有可选项 */
function renderChips(containerId, items, picked, onPick, emptyHint) {
  const box = el(containerId);
  if (!items.length) {
    box.innerHTML = emptyHint ? `<span class="sh-hint">${esc(emptyHint)}</span>` : '';
    return false;
  }
  box.innerHTML = items.map((it) =>
    `<button data-id="${esc(it.id)}"${it.id === picked ? ' class="sel"' : ''}>${esc(it.label)}</button>`
  ).join('');
  box.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { onPick(b.dataset.id); renderSheet(); };
  });
  return true;
}

function renderSheet() {
  if (wsList.length && !pickedWs) pickedWs = wsList[0].path;
  const hasWs = renderChips(
    'wsChips',
    wsList.map((w) => ({ id: w.path, label: w.name })),
    pickedWs,
    (v) => { pickedWs = v; },
    '没有可用工作区。对应的 IDE 窗口需要开着。'
  );

  // 默认值取 agent 报告的 currentValue，而不是列表第一项
  if (modeList.length && !pickedMode) {
    pickedMode = presetDefaults.mode && modeList.some((m) => m.id === presetDefaults.mode)
      ? presetDefaults.mode : modeList[0].id;
  }
  const NEED_RELOAD = '读不到清单。若刚更新过扩展，需要在 Kiro 里执行 Developer: Reload Window。';
  renderChips('modeChips', modeList, pickedMode, (v) => { pickedMode = v; }, NEED_RELOAD);

  if (modelList.length && !pickedModel) {
    pickedModel = presetDefaults.model && modelList.some((m) => m.id === presetDefaults.model)
      ? presetDefaults.model : modelList[0].id;
  }
  const mEl = el('modelList');
  if (!modelList.length) {
    mEl.innerHTML = `<span class="sh-hint">${esc(NEED_RELOAD)}</span>`;
  } else {
    mEl.innerHTML = modelList.map((m) =>
      `<button data-id="${esc(m.id)}"${m.id === pickedModel ? ' class="sel"' : ''}>` +
      `<span class="mtxt">${esc(m.label)}` +
      `${m.rate ? ` <span class="src">${m.rate}x</span>` : ''}` +
      `${m.source === 'history' ? ' <span class="src">用过</span>' : ''}` +
      `${m.desc ? `<span class="desc">${esc(m.desc)}</span>` : ''}</span>` +
      `<span class="tick">✓</span></button>`
    ).join('');
    mEl.querySelectorAll('button').forEach((b) => {
      b.onclick = () => { pickedModel = b.dataset.id; renderSheet(); };
    });
  }

  el('createBtn').disabled = !hasWs;
}

el('newBtn').onclick = openSheet;
el('shBd').onclick = closeSheet;
el('createBtn').onclick = () => {
  el('createBtn').disabled = true;
  el('createBtn').textContent = '创建中…';
  send('session:create', {
    workspacePath: pickedWs, modeId: pickedMode, modelId: pickedModel,
  });
};

// ---------------------------------------------------------------- 归档页
function renderArchived() {
  view = 'archived';
  openId = null;
  titleEl.textContent = '已归档';
  el('back').classList.remove('hide');
  el('searchBtn').classList.add('hide');
  el('newBtn').classList.add('hide');
  el('searchWrap').classList.add('hide');
  el('composer').classList.add('hide');
  el('pend').classList.add('hide');
  agentBusy = '';
  paintDot();

  const items = sessions
    .filter((s) => archived.has(s.sessionId))
    .sort((a, b) => b.lastActiveAt - a.lastActiveAt);
  subEl.textContent = `${items.length} 个会话 · 只影响这台手机的显示`;
  subEl.classList.remove('hide');

  if (!items.length) {
    mainEl.innerHTML = '<div class="empty">没有已归档的会话</div>';
    return;
  }
  mainEl.innerHTML = items.map((s) =>
    `<div class="arch" data-id="${esc(s.sessionId)}">
       <div class="arch-main">
         <div class="ttl">${esc(s.title)}</div>
         <div class="meta">
           <span class="t">${fmtTime(s.lastActiveAt)}</span>
           ${s.workspaceName ? `<span class="sep">·</span><span class="ws">${esc(s.workspaceName)}</span>` : ''}
           ${s.modelId ? `<span class="sep">·</span><span class="model">${esc(shortModel(s.modelId))}</span>` : ''}
         </div>
       </div>
       <button class="arch-back" data-id="${esc(s.sessionId)}">放回</button>
     </div>`
  ).join('') + `<button class="arch-all" id="unarchAll">全部放回（${items.length}）</button>`;

  mainEl.querySelectorAll('.arch-back').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); unarchive(b.dataset.id); };
  });
  mainEl.querySelectorAll('.arch-main').forEach((n) => {
    n.onclick = () => openSession(n.parentElement.dataset.id, 'archived');
  });
  el('unarchAll').onclick = () => {
    const n = archived.size;
    archived.clear();
    saveArchived();
    toast(`已放回 ${n} 个会话`);
    renderList();
  };
}

function unarchive(sessionId) {
  const s = sessions.find((x) => x.sessionId === sessionId);
  archived.delete(sessionId);
  saveArchived();
  if (navigator.vibrate) navigator.vibrate(20);
  toast(`已放回「${(s ? s.title : sessionId).slice(0, 12)}」`);
  if (archived.size) renderArchived();
  else renderList();
}

// ---------------------------------------------------------------- 交互
el('back').onclick = () => {
  // 退回列表前把草稿收进当前会话名下。少了这一步，草稿会滞留在输入框里，
  // 下次进任意一个会话就变成了那个会话的内容。
  stashDraft(openId);
  if (view === 'chat' && chatFrom === 'archived' && archived.size) renderArchived();
  else renderList();
};
el('searchBtn').onclick = () => {
  const w = el('searchWrap');
  const on = w.classList.toggle('hide');
  if (!on) el('search').focus();
  else { searchQ = ''; el('search').value = ''; renderList(); }
};
el('search').addEventListener('input', (e) => {
  searchQ = e.target.value;
  renderList();
});

const input = el('input');
const sendBtn = el('send');

// ---------------------------------------------------------------- 附件
/** 图片最长边。视觉模型不需要原图，而手机原图动辄 8-12MB，base64 后会顶爆帧上限 */
const IMG_MAX_EDGE = 1600;
/** 单个非图片文件上限（base64 之前） */
const MAX_ATT_BYTES = 5 * 1024 * 1024;
/**
 * 一条消息里 base64 总量上限，按服务端**实际**帧上限的 75% 算，留出 JSON 外壳的余量。
 *
 * 这个值原来是写死的 6MB，与 wsServer 的 8MB 只靠一句注释关联 —— 改一边另一边就静默
 * 失配，表现是附件在服务端被拒但手机上看不出原因。现在服务端在 hello 里报真实值。
 * 下面的兜底数字只在拿不到 hello 时使用，t2 有闸门盯着它和服务端保持一致。
 */
const FRAME_BUDGET_RATIO = 0.75;
const MAX_PAYLOAD_FALLBACK = 8 * 1024 * 1024;
let maxTotalB64 = Math.floor(MAX_PAYLOAD_FALLBACK * FRAME_BUDGET_RATIO);
let atts = [];

const fmtSize = (n) =>
  n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';

/**
 * 图片在手机侧先缩边再编码。
 * 不缩的话一张照片就能超过服务端 8MB 的帧上限，而且传上去也没有额外收益。
 */
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, IMG_MAX_EDGE / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const durl = c.toDataURL('image/jpeg', 0.85);
      resolve({ mimeType: 'image/jpeg', data: durl.slice(durl.indexOf(',') + 1) });
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('图片解不开'));
    };
    img.src = url;
  });
}

function readBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result || '');
      resolve(s.slice(s.indexOf(',') + 1));
    };
    r.onerror = () => reject(new Error('读不出来'));
    r.readAsDataURL(file);
  });
}

function renderAtts() {
  const box = el('atts');
  box.classList.toggle('hide', atts.length === 0);
  box.innerHTML = atts
    .map(
      (a, i) =>
        `<span class="att">${a.thumb ? `<img src="${esc(a.thumb)}" alt="">` : ''}` +
        `<span class="fn">${esc(a.name)}</span>` +
        `<span class="sz">${esc(a.sizeText)}</span>` +
        `<span class="x" data-i="${i}">✕</span></span>`
    )
    .join('');
  box.querySelectorAll('.x').forEach((x) => {
    x.onclick = () => {
      atts.splice(Number(x.dataset.i), 1);
      renderAtts();
      syncSendState();
    };
  });
}

function syncSendState() {
  sendBtn.disabled = !input.value.trim() && atts.length === 0;
}

async function addFiles(files) {
  const before = atts.length;
  for (const f of files) {
    try {
      const isImg = (f.type || '').startsWith('image/');
      if (!isImg && f.size > MAX_ATT_BYTES) {
        toast(`${f.name} 超过 ${fmtSize(MAX_ATT_BYTES)}，没加上`);
        continue;
      }
      const got = isImg
        ? await shrinkImage(f)
        : { mimeType: f.type || 'application/octet-stream', data: await readBase64(f) };
      const total = atts.reduce((s, a) => s + a.data.length, 0) + got.data.length;
      if (total > maxTotalB64) {
        toast('这条消息的附件总量超上限了，先发出去再加');
        continue;
      }
      atts.push({
        name: f.name || 'file',
        mimeType: got.mimeType,
        data: got.data,
        sizeText: fmtSize(Math.round((got.data.length * 3) / 4)),
        thumb: isImg ? `data:${got.mimeType};base64,${got.data}` : '',
      });
    } catch (err) {
      toast(`${f.name} 加不上：${err.message}`);
    }
  }
  renderAtts();
  syncSendState();
  // 成功也要有反馈：选了文件却什么都没出现时，得能分清是选择器没给、还是这里把它丢了
  const added = atts.length - before;
  if (added > 0) toast(`已添加 ${added} 个附件`);
  else if (files.length) toast('一个都没加上，可能超限或格式不支持');
}

const onPicked = async (e) => {
  const files = [...(e.target.files || [])];
  e.target.value = '';
  if (files.length) await addFiles(files);
};
const showAttMenu = (v) => el('attmenu').classList.toggle('hide', !v);
el('attach').onclick = (e) => {
  e.stopPropagation();
  showAttMenu(el('attmenu').classList.contains('hide'));
};
el('pickImg').onclick = () => {
  showAttMenu(false);
  el('file').click();
};
el('pickDoc').onclick = () => {
  showAttMenu(false);
  el('doc').click();
};

// 点别处收起菜单
document.addEventListener('click', () => showAttMenu(false));
el('file').onchange = onPicked;
el('doc').onchange = onPicked;

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 132) + 'px';
  syncSendState();
});
sendBtn.onclick = () => {
  const text = input.value.trim();
  if (!openId || (!text && atts.length === 0)) return;
  const payload = { sessionId: openId, text };
  if (atts.length) {
    payload.attachments = atts.map((a) => ({ name: a.name, mimeType: a.mimeType, data: a.data }));
  }
  send('session:send', payload);
  // 乐观置位：不等 sent 应答。这几秒里 agent 已经在跑，停止键必须已经可点
  lastSendAt = Date.now();
  setTurnActive(true);
  // 已经发出去了，草稿不该再留着 —— 否则回到这个会话又会看到刚发过的内容
  drafts.delete(openId);
  input.value = '';
  input.style.height = 'auto';
  atts = [];
  renderAtts();
  syncSendState();
};

/*
 * 锁屏、切到别的 App、网络切换之后回来时，重连定时器可能已经被浏览器冻结、不会自己醒。
 * 这几个事件是「人回来了 / 网络回来了」的确定信号，比等定时器可靠。
 * pageshow 是给 iOS Safari 兜底：它从后台恢复时不一定触发 visibilitychange。
 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') ensureConnected();
});
window.addEventListener('online', () => ensureConnected());
window.addEventListener('pageshow', () => ensureConnected());

connect();
</script>
